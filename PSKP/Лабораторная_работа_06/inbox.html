<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>06-01 — входящие письма</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f5f7fa; color: #172b4d; font: 16px/1.5 system-ui, sans-serif; }
        main { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        h1 { margin-bottom: 8px; font-size: 1.8rem; }
        button { min-height: 44px; padding: 10px 18px; border: 0; border-radius: 6px; color: white; background: #174db7; font: inherit; cursor: pointer; }
        :focus-visible { outline: 3px solid #174db7; outline-offset: 3px; }
        article { background: white; border: 1px solid #d9e0e9; border-radius: 8px; margin: 16px 0; padding: 20px; overflow-wrap: anywhere; }
        h2 { margin: 0 0 10px; font-size: 1.15rem; }
        p { margin: 6px 0; }
        pre { white-space: pre-wrap; font: inherit; border-top: 1px solid #d9e0e9; padding-top: 14px; }
        a { color: #174db7; }
    </style>
</head>
<body>
<main>
    <h1>Входящие письма</h1>
    <p>Учебный SMTP-приёмник · 127.0.0.1:1025</p>
    <p>Здесь отображаются локально принятые письма. Они не пересылаются в Gmail.</p>
    <button id="refresh" type="button">Обновить</button>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="messages" aria-label="Принятые письма"></section>
</main>
<script>
    const status = document.getElementById("status");
    const container = document.getElementById("messages");
    async function refresh() {
        try {
            const response = await fetch("/api/messages");
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const messages = await response.json();
            const articles = messages.map(message => {
                const article = document.createElement("article");
                const heading = document.createElement("h2");
                heading.textContent = `#${message.id} · ${message.subject}`;
                article.append(heading);
                for (const line of [
                    `От: ${message.from}`, `Кому: ${message.to}`,
                    `Принято: ${new Date(message.date).toLocaleString("ru-RU")}`,
                    `SMTP-конверт: ${message.envelope.from} → ${message.envelope.to.join(", ")}`
                ]) {
                    const p = document.createElement("p");
                    p.textContent = line;
                    article.append(p);
                }
                const text = document.createElement("pre");
                text.textContent = message.text;
                article.append(text);
                const raw = document.createElement("a");
                raw.href = `/api/messages/${message.id}/raw`;
                raw.target = "_blank";
                raw.rel = "noopener";
                raw.textContent = "Исходное письмо с SMTP-заголовками";
                article.append(raw);
                return article;
            });
            container.replaceChildren(...articles);
            const label = `Принято писем: ${messages.length}`;
            if (status.textContent !== label) status.textContent = label;
            if (!messages.length) container.textContent = "Пока писем нет. Отправь сообщение из приложения 06-02, 06-03 или 06-04.";
        } catch (error) {
            status.textContent = `Ошибка: ${error.message}`;
        }
    }
    document.getElementById("refresh").onclick = refresh;
    refresh();
    setInterval(refresh, 2000);
</script>
</body>
</html>
