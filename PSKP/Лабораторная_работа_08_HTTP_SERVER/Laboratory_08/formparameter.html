<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Параметры формы</title>
</head>
<body>
    <h1>Параметры формы</h1>
    <form action="/formparameter" method="post">
        <p><label>Имя <input type="text" name="name"></label></p>
        <p><label>Число <input type="number" name="number"></label></p>
        <p><label>Дата <input type="date" name="date"></label></p>
        <p><label><input type="checkbox" name="confirmed" value="yes"> Подтверждаю</label></p>
        <p>
            <label><input type="radio" name="option" value="first" checked> Первый вариант</label>
            <label><input type="radio" name="option" value="second"> Второй вариант</label>
        </p>
        <p><label>Сообщение <textarea name="message"></textarea></label></p>
        <input type="submit" name="action" value="Отправить">
        <input type="submit" name="action" value="Сохранить">
    </form>
    <p><a href="/">На главную</a></p>
</body>
</html>
